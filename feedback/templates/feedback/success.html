<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Received</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #f6f7f9;
            color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .card {
            background: #fff;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 2.5rem 2rem;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        }

        .icon {
            width: 56px;
            height: 56px;
            margin: 0 auto 1.25rem;
            background: #ecfdf5;
            color: #059669;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.75rem;
            line-height: 1;
        }

        h1 {
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        p {
            color: #6b7280;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.75rem;
        }

        a {
            display: inline-block;
            text-decoration: none;
            color: #fff;
            background: #111827;
            padding: 0.65rem 1.25rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.15s ease;
        }

        a:hover {
            background: #374151;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon" aria-hidden="true">✓</div>
        <h1>Thank you!</h1>
        <p>Your feedback has been received. We appreciate you taking the time to share your thoughts.</p>
        <a href="{% url 'feedback_create' %}">Send another feedback</a>
    </div>
</body>
</html>
